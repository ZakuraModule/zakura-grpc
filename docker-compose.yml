services:
  zakura:
    build:
      context: .
      dockerfile: docker/Dockerfile
      additional_contexts:
        zakura: https://github.com/ZakuraModule/zakura.git#feat/geyser-plugin-framework
    restart: unless-stopped
    environment:
      CONFIG_FILE_PATH: /etc/zakura/zakurad.toml
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - ./docker/zakurad.toml:/etc/zakura/zakurad.toml:ro
      - zakura-state:/home/zakura/.cache/zakura

volumes:
  zakura-state:
