syntax = "proto3";

package zakura.geyser.v1;

import "google/protobuf/timestamp.proto";

service Geyser {
  rpc Subscribe(stream SubscribeRequest) returns (stream SubscribeUpdate) {}
  rpc SubscribeReplayInfo(SubscribeReplayInfoRequest) returns (SubscribeReplayInfoResponse) {}
  rpc Ping(PingRequest) returns (PongResponse) {}
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse) {}
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_BLOCK_ACCEPTED = 1;
  EVENT_TYPE_BEST_CHAIN_CHANGED = 2;
  EVENT_TYPE_BLOCK_FINALIZED = 3;
  EVENT_TYPE_MEMPOOL_CHANGED = 4;
  EVENT_TYPE_TRANSACTION = 5;
  EVENT_TYPE_UTXO = 6;
}

message SubscribeRequest {
  // An empty list subscribes to all event types.
  repeated EventType event_types = 1;
  // Replays retained block-scoped events starting at this height, then follows live events.
  optional uint32 from_height = 2;
  optional SubscribeRequestPing ping = 3;
  // Named filters let one update report every client filter it matched.
  map<string, SubscribeRequestFilter> filters = 4;
}

message SubscribeRequestPing {
  int32 id = 1;
}

message SubscribeRequestFilter {
  // An empty list matches every event type.
  repeated EventType event_types = 1;
  // Ignore block-scoped events below this height.
  optional uint32 min_height = 2;
}

message SubscribeUpdate {
  uint32 schema_version = 1;
  bytes session_id = 2;
  // Monotonically increasing for every gRPC update within one session.
  uint64 sequence = 3;
  google.protobuf.Timestamp observed_at = 4;
  EventType event_type = 5;
  // Names from SubscribeRequest.filters which matched this update.
  repeated string filters = 6;
  // Sequence of the Zakura plugin event which produced this update. One block
  // event can produce a block update and multiple transaction/UTXO updates.
  uint64 source_sequence = 7;

  oneof update {
    BlockUpdate block = 10;
    BestChainUpdate best_chain = 11;
    MempoolUpdate mempool = 12;
    PongUpdate pong = 13;
    TransactionUpdate transaction = 14;
    UtxoUpdate utxo = 15;
  }
}

enum BlockCommitment {
  BLOCK_COMMITMENT_UNSPECIFIED = 0;
  // The block was validated and admitted to non-finalized state. It can still
  // be on a side chain or be removed by a reorganization.
  BLOCK_COMMITMENT_ACCEPTED = 1;
  // The block became part of finalized canonical state.
  BLOCK_COMMITMENT_FINALIZED = 2;
}

message BlockUpdate {
  uint32 height = 1;
  string hash = 2;
  // Consensus-encoded Zcash block bytes.
  bytes block = 3;
  optional uint64 receipt_order = 4;
  bool finalized = 5;
}

message BestChainUpdate {
  uint32 height = 1;
  string hash = 2;

  oneof change {
    BestChainGrow grow = 10;
    BestChainReset reset = 11;
  }
}

message BestChainGrow {
  string previous_block_hash = 1;
  repeated string transaction_ids = 2;
}

message BestChainReset {}

enum MempoolAction {
  MEMPOOL_ACTION_UNSPECIFIED = 0;
  MEMPOOL_ACTION_ADDED = 1;
  MEMPOOL_ACTION_INVALIDATED = 2;
  MEMPOOL_ACTION_MINED = 3;
}

message MempoolUpdate {
  MempoolAction action = 1;
  repeated string transaction_ids = 2;
}

message TransactionUpdate {
  string transaction_id = 1;
  // V5+ unmined IDs also commit to the authorizing data.
  string unmined_transaction_id = 2;
  optional string auth_digest = 3;
  // Consensus-encoded Zcash transaction bytes.
  bytes transaction = 4;
  uint32 height = 5;
  string block_hash = 6;
  uint32 transaction_index = 7;
  BlockCommitment commitment = 8;
  bool coinbase = 9;
  // Decoded transparent inputs in consensus order. Shielded transaction data
  // remains available in the consensus-encoded transaction field.
  repeated TransparentInput transparent_inputs = 10;
  // Decoded transparent outputs in consensus order.
  repeated TransparentOutput transparent_outputs = 11;
}

message TransparentInput {
  uint32 input_index = 1;
  uint32 sequence = 2;

  oneof input {
    TransparentPrevoutInput prevout = 10;
    TransparentCoinbaseInput coinbase = 11;
  }
}

message TransparentPrevoutInput {
  Outpoint previous_output = 1;
  // Raw scriptSig bytes without the CompactSize length prefix.
  bytes unlock_script = 2;
}

message TransparentCoinbaseInput {
  uint32 height = 1;
  bytes data = 2;
}

message TransparentOutput {
  uint32 output_index = 1;
  uint64 value_zat = 2;
  // Raw scriptPubKey bytes without the CompactSize length prefix.
  bytes lock_script = 3;
}

message Outpoint {
  string transaction_id = 1;
  uint32 output_index = 2;
}

message UtxoCreated {
  Outpoint outpoint = 1;
  uint64 value_zat = 2;
  // Raw transparent scriptPubKey bytes without the CompactSize length prefix.
  bytes lock_script = 3;
}

message UtxoSpent {
  Outpoint outpoint = 1;
  uint32 input_index = 2;
  // Raw scriptSig bytes without the CompactSize length prefix.
  bytes unlock_script = 3;
  uint32 sequence = 4;
}

message UtxoChange {
  oneof change {
    UtxoCreated created = 1;
    UtxoSpent spent = 2;
  }
}

message UtxoUpdate {
  uint32 height = 1;
  string block_hash = 2;
  string transaction_id = 3;
  uint32 transaction_index = 4;
  BlockCommitment commitment = 5;
  // Changes are ordered with spends first, followed by created outputs. Input
  // and output indexes preserve their order inside the transaction.
  repeated UtxoChange changes = 6;
}

message PongUpdate {
  int32 id = 1;
}

message SubscribeReplayInfoRequest {}

message SubscribeReplayInfoResponse {
  optional uint32 first_available_height = 1;
  optional uint32 latest_height = 2;
  uint32 retained_block_capacity = 3;
}

message PingRequest {
  int32 count = 1;
}

message PongResponse {
  int32 count = 1;
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
  uint32 interface_version = 2;
  uint32 event_schema_version = 3;
}
